site_name: oXs on RP2040 – Erweiterungen & Doku
site_description: Erweiterte oXs-on-RP2040 Firmware, EdgeTX Lua Configurator, Telemetrie-Konverter und RTH
site_url: https://networker-001.github.io/oXs_on_RP2040-add-ons/
repo_url: https://github.com/Networker-001/oXs_on_RP2040-add-ons
repo_name: Networker-001/oXs_on_RP2040-add-ons

nav:
  - Startseite & Einstieg: index.md
  - Projekte & Anleitungen:
      - FrSky S.Port Konverter: Konverter.md
      - INAV LTM Konverter: INAV Konverter.md
      - Zusatz-Sensoren & Erweiterungen: oxs.md
  - Firmware & Downloads (.uf2): https://github.com
  - Community & Foren:
      - RC-Network Diskussionsthread: https://rc-network.de
      - Original-Repository (mstrens): https://github.com

  src/
  include/
  lib/
  build/
  test/
  .vscode/
  Doku - Kopie/
  Doku/
  doc/
  Config/

theme:
  name: material
  language: de
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Dunkles Design aktivieren
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Helles Design aktivieren
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Startseite & Einstieg: README.md
  - Projekte & Anleitungen:
      - FrSky S.Port Konverter: Konverter.md
      - INAV LTM Konverter: INAV Konverter.md
      - Zusatz-Sensoren & Erweiterungen: oxs.md
  - Firmware & Downloads (.uf2): https://github.com
  - Community & Foren:
      - RC-Network Diskussionsthread: https://rc-network.de
      - Original-Repository (mstrens): https://github.com

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list

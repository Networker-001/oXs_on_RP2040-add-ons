site_name: oXs on RP2040 – Erweiterungen & Doku
site_description: Erweiterte oXs-on-RP2040 Firmware, EdgeTX Lua Configurator, Telemetrie-Konverter und RTH
site_url: https://github.io
repo_url: https://github.com
repo_name: Networker-001/oXs_on_RP2040-add-ons

# Nutzt direkt das Hauptverzeichnis, damit Bilder/, README.md & bestehende .md-Dateien weiter funktionieren
docs_dir: .
exclude_docs: |
  src/
  include/
  lib/
  build/
  test/
  .vscode/
  Doku - Kopie/

theme:
  name: material
  language: de
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Dunkles Design aktivieren
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Helles Design aktivieren
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

# Linke Navigation mit Projekten, Anleitungen & .uf2-Downloads
nav:
  - Startseite & Einstieg: README.md
  - News & Versionen: news.md
  - Projekte & Anleitungen:
      - EdgeTX Lua Configurator (oXsConfig): edgetx-lua.md
      - FrSky S.Port Konverter: Konverter.md
      - INAV LTM Konverter: INAV Konverter.md
      - Zusatz-Sensoren & USB-Pinout: oxs.md
  - Firmware & Downloads (.uf2):
      - Übersicht & Download-Links: downloads.md
  - Community & Foren:
      - RC-Network Diskussionsthread: https://rc-network.de
      - Original-Repository (mstrens): https://github.com

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
